name: Build And Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  BuildTest:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows_MSVC
            flavor: Release
            runner: windows-latest
            generator: Ninja
            cc: cl
            cxx: cl

          # TODO: Disabled to test individually
          # BEGIN - TESTED AND VERIFIED
          #- name: Linux_GCC
          #  flavor: Debug
          #  runner: ubuntu-latest
          #  generator: Ninja
          #  cc: gcc
          #  cxx: g++

          #- name: Linux_LLVM
          #  flavor: Debug
          #  runner: ubuntu-latest
          #  generator: Ninja
          #  cc: clang
          #  cxx: clang++

          #- name: MacOS_Debug
          #  flavor: Debug
          #  runner: macos-latest
          #  generator: Ninja
          #  cc: clang
          #  cxx: clang++

          #- name: MacOS_Release
          #  flavor: Release
          #  runner: macos-latest
          #  generator: Ninja
          #  cc: clang
          #  cxx: clang++
          #  publish: true
          # END   - TESTED AND VERIFIED

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      #
      # Setup and Configuration
      #
      - name: Linux - Setup
        if: ${{ startsWith(matrix.runner, 'ubuntu') }}
        run: |
          sudo add-apt-repository -y ppa:neovim-ppa/stable
          sudo apt-get install -y neovim ninja-build libqt6svg6 qt6-svg-dev libqt6svgwidgets6 qt6-base-dev qtchooser qmake6 qt6-base-dev-tools
          sudo apt-get update -y

      - name: MacOS - Setup
        if: ${{ startsWith(matrix.runner, 'macos') }}
        run: |
          brew install neovim qt
          brew ls --formula | grep -wq ninja || brew install ninja
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "Qt6_DIR=$(brew --prefix qt)/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Windows - Install Qt
        if: ${{ startsWith(matrix.runner, 'windows') }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Windows - Setup MSVC
        if: ${{ startsWith(matrix.runner, 'windows') }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Windows - Setup
        if: ${{ startsWith(matrix.runner, 'windows') }}
        run: |
          choco install -y neovim ninja
          set PATH="%PATH%;C:\Program Files\nvim\bin"
          setx PATH "%PATH%;C:\Program Files\nvim\bin"
        shell: pwsh

      #
      # Build and Test
      #
      - name: Neovim Version
        run: nvim --version

      - name: Configure
        env:
          CMAKE_BUILD_TYPE: ${{ matrix.flavor }}
          CMAKE_GENERATOR: ${{ matrix.generator }}
        run: >
          cmake -B ./build
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DENABLE_TESTS=ON
          -DCTEST_EXE_ARGS=${{ matrix.ctest_exe_args }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Test
        uses: GabrielBB/xvfb-action@v1 # Required by Linux, no X11 $DISPLAY
        with:
          working-directory: ${{ github.workspace }}/build
          run: ctest -VV --timeout 120 --output-on-failure -C ${{ matrix.flavor }}

      #
      # Deploy Release Binaries
      #
      - name: MacOS - Publish
        if: ${{ matrix.publish && startsWith(matrix.runner, 'macos') }}
        run: |
          $(brew --prefix qt)/bin/macdeployqt ./build/bin/nvim-qt.app -dmg
          mv ./build/bin/nvim-qt.dmg neovim-qt.dmg

      - name: Upload Artifacts
        if: ${{ matrix.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            neovim-qt.dmg
            neovim-qt-installer.msi
            neovim-qt.zip
