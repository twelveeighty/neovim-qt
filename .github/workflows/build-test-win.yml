name: Windows Build And Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  BuildTest:
    name: WinBuildTest
    strategy:
      fail-fast: true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and Test
        env:
          CMAKE_BUILD_TYPE: Release
          CMAKE_GENERATOR: Ninja
        run: |
          iwr "https://github.com/neovim/neovim/releases/download/stable/nvim-win64.zip" -OutFile Neovim.zip
          7z x Neovim.zip
          $env:Path += ";" + $PWD.Path + "\nvim-win64\bin"
          nvim --version
          cmake -B ./build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DENABLE_TESTS=ON
          cmake --build ${{ github.workspace }}/build
        shell: pwsh

      - name: Test
        uses: GabrielBB/xvfb-action@v1 # Required by Linux, no X11 $DISPLAY
        with:
          working-directory: ${{ github.workspace }}/build
          run: ctest -VV --timeout 120 --output-on-failure -C Release

