name: Windows Build And Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  BuildTest:
    name: WinBuildTest
    strategy:
      fail-fast: true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and Test
        run: |
          iwr "https://github.com/neovim/neovim/releases/download/stable/nvim-win64.zip" -o Neovim.zip
          7z x Neovim.zip
          set PATH=%PATH%;%CD%\nvim-win64\bin
          nvim --version
        shell: pwsh

